name: service_sync
description: "ServiceSync - Professional Field Service Management Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6

  supabase_flutter: ^2.15.0

  sqflite: ^2.3.3+1
  path: ^1.9.0

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  fl_chart: ^0.68.0

  google_maps_flutter: ^2.6.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0

  # Signature Pad
  signature: ^5.4.0

  pdf: ^3.10.8
  printing: ^5.13.1
  open_filex: ^4.5.0

  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  uuid: ^4.3.3
  intl: ^0.19.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
